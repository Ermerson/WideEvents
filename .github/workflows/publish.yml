name: Publish to NuGet

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore WideEvents.slnx

      - name: Build
        run: dotnet build WideEvents.slnx --no-restore -c Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test WideEvents.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack WideEvents.slnx --no-build -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Push to NuGet
        run: |
          for f in ./artifacts/*.nupkg; do
            dotnet nuget push "$f" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          for f in ./artifacts/*.snupkg; do
            dotnet nuget push "$f" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
